<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 505" width="720" height="505" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Energy use across ontogeny: whole-body metabolic rate from conception to death</title>
<desc id="dsc">Whole-body basal metabolic rate in watts for males (blue) and females (magenta) on a broken, not-to-scale age axis. Three windows are expanded: prenatal development and infancy, puberty, and a hypothetical pregnancy near age 30. The spans between them are compressed and separated by axis-break marks. Both curves begin at conception, rise through childhood, diverge sharply at puberty to a male peak near 95 watts and a female plateau near 70 watts, then decline and drop to zero at the average age of death: 76.5 years for males, 81.4 for females.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t-pri { fill: #1f1e1c; }
  .t-sec { fill: #5f5e5a; }
  .t-ter { fill: #8a8980; }
  .axis  { stroke: rgba(0,0,0,0.34); }
  .gridl { stroke: rgba(0,0,0,0.12); }
  .divide{ stroke: #8a8980; }
  .male  { stroke: #1667cc; }
  .female{ stroke: #c81ea6; }
  .preg  { stroke: #eb6834; }
  .f-male   { fill: #1667cc; }
  .f-female { fill: #c81ea6; }
  .t-preg   { fill: #993c1d; }
  .t-pub    { fill: #854f0b; }
  .halo  { stroke: #fbfaf7; }
  .band-gest { fill: #8a8980; opacity: 0.14; }
  .band-pub  { fill: #eda100; opacity: 0.15; }
  .band-preg { fill: #eb6834; opacity: 0.09; }
  @media (prefers-color-scheme: dark) {
    .t-pri { fill: #eceae4; }
    .t-sec { fill: #b4b2a9; }
    .t-ter { fill: #8a8980; }
    .axis  { stroke: rgba(255,255,255,0.34); }
    .gridl { stroke: rgba(255,255,255,0.13); }
    .male  { stroke: #5b9bf0; }
    .female{ stroke: #ea72cf; }
    .preg  { stroke: #f5895c; }
    .f-male   { fill: #5b9bf0; }
    .f-female { fill: #ea72cf; }
    .t-preg   { fill: #f5895c; }
    .t-pub    { fill: #eda100; }
    .halo  { stroke: #1b1b19; }
    .band-gest { opacity: 0.20; }
    .band-pub  { opacity: 0.20; }
    .band-preg { opacity: 0.14; }
  }
</style>

