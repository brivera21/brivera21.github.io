<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram Lab</title>
<style>
  :root{
    --bg:#121212; --panel:#1a1a1a; --panel2:#202020;
    --text:#e6e6e6; --muted:#9a9a9a; --line:#2b2b2b; --gold:#e4a01b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{max-width:1150px;margin:0 auto;padding:32px 20px 80px}
  header{border-top:4px solid var(--gold);padding-top:22px}
  h1{margin:0;font-size:28px}
  .sub{color:var(--muted);margin:6px 0 22px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  input[type=search]{flex:1 1 240px;min-width:200px;background:var(--panel);
    border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:8px;font-size:15px}
  input[type=search]::placeholder{color:#6c6c6c}
  button{background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
  button:hover{border-color:var(--gold);color:#fff}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .chip{background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px}
  .chip:hover{border-color:#4a4a4a;color:var(--text)}
  .chip.on{background:rgba(228,160,27,.14);border-color:var(--gold);color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-3px);border-color:var(--gold)}
  .thumb{height:210px;overflow:hidden;background:#0b1220;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
  .thumb iframe{width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
  .badge{position:absolute;top:10px;right:10px;background:var(--gold);color:#1a1a1a;
    font-size:10px;font-weight:700;letter-spacing:.6px;padding:3px 8px;border-radius:999px;z-index:2}
  .card-body{padding:13px 15px 16px}
  .card h3{margin:0 0 7px;font-size:16px;line-height:1.3}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .tag{font-size:11px;color:var(--gold);border:1px solid rgba(228,160,27,.35);padding:2px 8px;border-radius:999px}
  .card p{margin:0;font-size:13.5px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px 0}

  .overlay{position:fixed;inset:0;background:rgba(8,8,8,.96);display:none;z-index:60}
  .overlay.on{display:flex;flex-direction:column}
  .obar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .obar .spacer{flex:1}
  .obar .count{color:var(--muted);font-size:13px}
  .obar a{color:var(--gold);text-decoration:none;font-size:14px;border:1px solid var(--line);
    padding:9px 14px;border-radius:8px}
  .obar a:hover{border-color:var(--gold)}
  .ostage{flex:1;display:flex;gap:20px;padding:18px;overflow:hidden}
  .oframe{flex:1 1 100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .oframe iframe{width:100%;height:100%;border:0;display:block}
  .onotes{flex:1 1 34%;max-width:400px;overflow:auto;padding-right:4px}
  .onotes h2{margin:0 0 6px;font-size:20px}
  .note{margin-bottom:16px}
  .note b{display:block;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;
    color:var(--gold);margin-bottom:5px}
  .note p{margin:0 0 6px;font-size:13.5px;color:#d0d0d0}
  .note ul{margin:0;padding-left:18px;font-size:13.5px;color:#d0d0d0}
  .note li{margin-bottom:5px}
  .mine{border-left:2px solid #3a3a3a;padding-left:12px}
  .mine p{color:#8a8a8a;font-style:italic}
  details.cav{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
  details.cav summary{cursor:pointer;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  details.cav summary:hover{color:var(--gold)}
  details.cav ul{margin:10px 0 0;padding-left:18px;font-size:13px;color:#b8b8b8}
  details.cav li{margin-bottom:6px}
  .hint{color:#5f5f5f;font-size:12px;padding:0 18px 12px}
  @media(max-width:820px){.ostage{flex-direction:column;overflow:auto}.oframe{min-height:60vh}.onotes{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Diagram Lab</h1>
    <div class="sub">Teaching diagrams built to reward a closer look.</div>
  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="Search titles, tags, notes…">
    <button id="shuffle">Shuffle ⤮</button>
    <button id="focusFirst">Focus mode ▸</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Nothing matches that filter.</div>
</div>

<div class="overlay" id="ov">
  <div class="obar">
    <button id="prev">← Prev</button>
    <button id="next">Next →</button>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <span id="extras"></span>
    <button id="close">Close ✕</button>
  </div>
  <div class="ostage">
    <div class="oframe"><iframe id="oframe" title="diagram"></iframe></div>
  </div>
  <div class="hint">← / → to move · Esc to close · open the full page for print versions and controls</div>
</div>

<script>
/* ============================================================
   ADD A DIAGRAM: copy a block, point `file` at its .html,
   give it a `thumb` (image path) or set thumbLive:true.
   ============================================================ */
const DIAGRAMS = [
  {
    id:'brain-composition',
    title:'Brain Composition Breakdown',
    file:'brain-composition.html',
    thumbLive:true,
    tags:['neuroanatomy','teaching','reference'],
    label:'INTERACTIVE',
    blurb:'What fills the fixed skull by volume, then the ~86 billion neurons broken down by type and where each is found.',
    extras:[],
    connects:'For lectures on brain composition, the Monro-Kellie doctrine and neuron counts.',
    caveats:[
      'The intracranial split (brain 80% / blood 10% / CSF 10%) is the standard Monro-Kellie figure; the neuron / glia / extracellular sub-split of the tissue is an approximate teaching estimate that varies by region and method.',
      'Extracellular space is ~16% of the whole intracranial volume, which is ~20% of the brain tissue alone; the two figures use different denominators.',
      'Neuron and glia numbers are roughly 1:1 (~86B neurons, ~85B non-neuronal cells); the old &ldquo;10 glia per neuron&rdquo; claim is wrong.',
      'Most brain neurons are cerebellar granule cells: the cerebellum holds ~69B (~80% of the total) in only ~10% of brain mass.',
      'The by-type percentages are estimates built from regional counts; the pyramidal-vs-interneuron and granule-vs-other splits are approximate.',
      'Neuron drawings are schematic: characteristic form only, not scale or exact morphology.'
    ],
    mine:''
  },
  {
    id:'nervous-tree',
    title:"The Nervous System's Family Tree",
    file:'nervous-system-tree.html',
    thumb:'tree.svg',
    tags:['evolution','neuroanatomy','teaching'],
    label:'SCROLLABLE',
    blurb:'From LUCA to Homo sapiens, with every relative that branched off along the way. Each carries its neuron count, shared DNA and a life-history bar.',
    extras:[
      {label:'Print PDF (A3) ↗', href:'nervous-system-tree.pdf'},
      {label:'tree.svg ↗', href:'tree.svg'}
    ],
    connects:'Complements the Animals, Primate and Hominins evolution lectures; the dates, innovations and life-history values are pulled from those decks.',
    caveats:[
      'Neuron counts here are <em>total brain</em> neurons (human ≈86B, chimp ≈28B). The lecture slides cite <em>cortical</em> neurons for the apes (chimp 6 to 7B). Both are correct; they just measure different things.',
      'The DNA percentages are <em>not one consistent measure</em>. Close relatives are DNA sequence identity (chimp ≈98.8%); distant animals are the share of genes with a human counterpart (mouse ≈85%, chicken ≈65%, fly ≈60%). Do not read the column as a single scale.',
      'DNA % is deliberately blank where no defensible figure exists: extinct hominins with no recoverable DNA (erectus, habilis, Australopithecus) and the ancestral grade nodes.',
      'Ancestral grade nodes (First brain, Vertebrate brain, Amniotes and so on) borrow a modern analog for neuron counts and life history. They are grades, not single species.',
      'The human lifespan bar uses modern life expectancy (~73 yr); the Hominins deck uses ancient 30 to 40 yr.',
      'Left off to avoid clutter: Paranthropus, sponges, cartilaginous fish.'
    ],
    mine:''
  },
  {
    id:'spatial-cells',
    title:'Spatial cells: which neuron fires where',
    file:'spatial-cells.html',
    thumbLive:true,
    tags:['spatial','hippocampus','teaching','animation'],
    label:'INTERACTIVE',
    blurb:'A rat explores, encodes an object location, then recalls it, with the cell types firing in step.',
    extras:[],
    connects:'Accompanies Neil Burgess, <em>Neural mechanisms of spatial cognition</em> (Jim Ranck symposium).',
    caveats:[
      'One example cell per type, except the boundary and head-direction sets. Real populations tile all locations, distances and directions.',
      'The green dots are all fields of a <em>single</em> grid cell, not separate cells.',
      'Head-direction cells are driven here by movement heading; the real variable is where the head points.',
      'Boundary vector cells fire at a <em>distance</em> from a boundary, not on contact.',
      'The cue card is decorative; landmark anchoring of the head-direction ring is not modelled.'
    ],
    mine:''
  },
  {
    id:'ontogeny-energy',
    title:'Energy use across ontogeny',
    file:'ontogeny-energy.html',
    thumb:'energy-curve.svg',
    tags:['physiology','metabolism','development','teaching'],
    label:'BROKEN AXIS',
    blurb:'Metabolic rate from conception to death, with gestation, puberty and pregnancy each given their own zoom.',
    extras:[
      {label:'energy-curve.svg ↗', href:'energy-curve.svg'}
    ],
    connects:'For lectures on ontogeny, energetics and life-history trade-offs.',
    caveats:[
      'Constructed reference curves (body mass × mass-specific BMR), not a measured cohort. Shapes are typical; individual points are not data.',
      'The drop to zero is a graphical device. Metabolism does not decline along that path to zero; the vertical marks where the population mean age at death falls.',
      '76.5 / 81.4 yr are <em>period</em> life expectancy at birth (CDC 2024). This is a period statistic, not a forecast for anyone alive now.',
      'The pregnancy bump is <em>absolute</em>. Pontzer et al. (2021) found fat-free-mass-adjusted expenditure does not rise in pregnancy at all; replot per kilogram and the bump nearly vanishes.',
      'Basal rate only. Total daily expenditure is about 1.4 to 2× these values, and the pregnancy increment is larger on that measure.',
      'Pre-pubertal sex separation is within noise; the two-colour treatment should not imply a real childhood difference.'
    ],
    mine:''
  },
  {
    id:'cortical-rhythms',
    title:'Cortical rhythms and areas',
    file:'cortical-rhythms.html',
    thumbLive:true,
    tags:['neuroanatomy','oscillations','teaching','animation'],
    label:'INTERACTIVE',
    blurb:'Three brain views built from the fs_LR/Conte69 surface, switchable between activity, traveling waves (δ/θ/α/γ), lobes and Brodmann areas.',
    extras:[],
    connects:'For lectures on cortical organisation and brain rhythms. Pairs with any EEG/oscillations session.',
    caveats:[
      'Only the <em>outlines</em> are real geometry (fs_LR/Conte69 32k surface, projected and contoured). Everything painted inside them is modelled.',
      'The lobe and Brodmann maps are <em>schematic</em>. Each dot takes the nearest landmark-placed seed (a Voronoi partition), not a cytoarchitectural atlas.',
      'Activity colours are synthetic (a sum of drifting plane waves). No value corresponds to a measured BOLD or connectivity figure.',
      'The Rate slider is a teaching control the brain does not have. It scales all four bands together, so their true frequency <em>ratios</em> are preserved.',
      "Alpha's front-to-back direction is the <em>resting</em> case; during active viewing it reverses to back-to-front.",
      'Delta is the only band shown on the coronal view. Theta, alpha and gamma travel front to back, which on a coronal section runs into the page.',
      'Conte69 is cortex only: no cerebellum or brainstem, and the coronal notch between the temporal lobes is where the brainstem would sit.',
      'Wave amplitude is uniform and isotropic here. Real traveling waves vary by region and travel at speeds that depend on fibre direction.'
    ],
    mine:''
  }
];

/* ---------- state ---------- */
let activeTags=new Set(), query='', view=[], idx=0;

const allTags=[...new Set(DIAGRAMS.flatMap(d=>d.tags))].sort();
const chips=document.getElementById('chips');
allTags.forEach(t=>{
  const b=document.createElement('button'); b.className='chip'; b.textContent=t;
  b.onclick=()=>{activeTags.has(t)?activeTags.delete(t):activeTags.add(t);b.classList.toggle('on');render();};
  chips.appendChild(b);
});

const matches=d=>{
  if(activeTags.size && !d.tags.some(t=>activeTags.has(t))) return false;
  if(!query) return true;
  const hay=(d.title+' '+d.tags.join(' ')+' '+d.blurb+' '+d.caveats.join(' ')+' '+d.connects+' '+d.mine).toLowerCase();
  return hay.includes(query);
};

function render(){
  const grid=document.getElementById('grid');
  view=DIAGRAMS.filter(matches);
  grid.innerHTML='';
  document.getElementById('empty').style.display=view.length?'none':'block';
  view.forEach((d,i)=>{
    const c=document.createElement('div'); c.className='card'; c.onclick=()=>open_(i);
    const thumb = d.thumbLive
      ? `<iframe src="${d.file}" loading="lazy" scrolling="no" tabindex="-1"></iframe>`
      : `<img src="${d.thumb}" alt="">`;
    c.innerHTML=`${d.label?`<span class="badge">${d.label}</span>`:''}
      <div class="thumb">${thumb}</div>
      <div class="card-body">
        <h3>${d.title}</h3>
        <div class="tags">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <p>${d.blurb}</p>
      </div>`;
    grid.appendChild(c);
  });
}

/* ---------- focus ---------- */
const ov=document.getElementById('ov');
function open_(i){ idx=i; paint(); ov.classList.add('on'); }
function paint(){
  const d=view[idx]; if(!d) return;
  document.getElementById('count').textContent=`${idx+1} / ${view.length}`;
  document.getElementById('oframe').src=d.file;
  document.getElementById('extras').innerHTML =
    `<a href="${d.file}" target="_blank">Open full page ↗</a> ` +
    d.extras.map(e=>`<a href="${e.href}" target="_blank">${e.label}</a>`).join(' ');
}
const move=n=>{ if(!view.length)return; idx=(idx+n+view.length)%view.length; paint(); };
document.getElementById('next').onclick=()=>move(1);
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('close').onclick=()=>{ov.classList.remove('on');document.getElementById('oframe').src='';};
document.getElementById('focusFirst').onclick=()=>{ if(view.length) open_(0); };
document.getElementById('shuffle').onclick=()=>{
  for(let i=DIAGRAMS.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[DIAGRAMS[i],DIAGRAMS[j]]=[DIAGRAMS[j],DIAGRAMS[i]];}
  render();
};
document.getElementById('q').oninput=e=>{query=e.target.value.toLowerCase().trim();render();};
addEventListener('keydown',e=>{
  if(!ov.classList.contains('on')){
    if(e.key==='r'||e.key==='R'){ if(view.length) open_((Math.random()*view.length)|0); }
    return;
  }
  if(e.key==='Escape'){ov.classList.remove('on');document.getElementById('oframe').src='';}
  if(e.key==='ArrowRight')move(1);
  if(e.key==='ArrowLeft')move(-1);
});

render();
</script>
</body>
</html>
