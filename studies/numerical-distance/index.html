<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Root Lab — Number Comparison Study</title>

  <!-- jsPsych core + plugins (pinned versions for reproducibility) -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" />
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-browser-check@1.0.3"></script>
  <!-- DataPipe (saves to your OSF project via pipe.jspsych.org) -->
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

  <style>
    body { background: #ffffff; color: #111; }
    .instructions { max-width: 720px; margin: 0 auto; text-align: left; line-height: 1.6; font-size: 18px; }
    .instructions h1, .instructions h2 { text-align: center; }
    .digit { font-size: 96px; font-weight: 700; font-family: "Helvetica Neue", Arial, sans-serif; line-height: 1.1; }
    .fix { font-size: 72px; color: #333; }
    .reminder { margin-top: 28px; font-size: 20px; color: #555; letter-spacing: 1px; }
    .reminder .k { font-weight: 700; color: #111; }
    .feedback-ok { color: #1a7f37; font-size: 40px; }
    .feedback-no { color: #b42318; font-size: 40px; }
    .toofast, .tooslow { color: #b42318; font-size: 26px; }
    .form-row { margin: 14px 0; font-size: 18px; }
    .form-row input, .form-row select { font-size: 17px; padding: 4px 6px; }
  </style>
</head>
<body></body>
<script>
/* ============================================================
   ROOT LAB — NUMERICAL DISTANCE EFFECT (magnitude comparison)
   ------------------------------------------------------------
   Paradigm: Moyer & Landauer (1967) symbolic magnitude comparison.
   Participants judge whether a single digit (1-9, excluding 5) is
   SMALLER or LARGER than the standard 5. Reaction time decreases as
   the numerical distance between the digit and 5 increases — the
   numerical distance effect.

   Runs entirely in the browser; data are saved to your OSF project
   through DataPipe (pipe.jspsych.org). No server required.

   >>> THINGS TO FILL IN before going live (search "FILL IN"):
     1. DATAPIPE_EXPERIMENT_ID  — from your DataPipe dashboard
     2. SONA_COMPLETION_URL     — your SONA credit-redirect URL (optional)
     3. Consent text            — replace with your IRB-approved text
   ============================================================ */

// ---- 1. CONFIG: FILL IN --------------------------------------
const DATAPIPE_EXPERIMENT_ID = "REPLACE_WITH_DATAPIPE_ID";
// Optional SONA credit redirect. Leave the "XXX" in place to disable
// the redirect (participants just see a thank-you screen instead).
const SONA_COMPLETION_URL = "https://stolaf.sona-systems.com/webstudy_credit.aspx?experiment_id=XXX&credit_token=YYY&survey_code=";

// Trial-count knobs (change these to lengthen/shorten the study).
const PRACTICE_REPS = 1;   // reps of each of the 8 digits in practice (1 => 8 practice trials)
const MAIN_REPS     = 12;  // reps of each digit in the main task (12 => 96 trials)
const N_BLOCKS      = 2;   // main task is split into this many blocks with breaks
const RESPONSE_LIMIT = 2000; // ms allowed to respond before "too slow"
// --------------------------------------------------------------

const jsPsych = initJsPsych({
  on_finish: function () {
    if (sona_id !== 'no_id' && SONA_COMPLETION_URL.indexOf("XXX") === -1) {
      window.location = SONA_COMPLETION_URL + encodeURIComponent(sona_id);
    } else {
      document.body.innerHTML =
        '<div class="instructions"><h2>Thank you!</h2>' +
        '<p>Your responses have been recorded. You may now close this window.</p></div>';
    }
  }
});

// Session identifiers
const sona_id = jsPsych.data.getURLVariable('sona_id') || 'no_id';
const subject_id = jsPsych.randomization.randomID(10);
// Counterbalance the response mapping across participants so the
// smaller/larger -> F/J assignment is not confounded with hand/side.
const map_larger_right = Math.random() < 0.5;
const KEY_SMALLER = map_larger_right ? 'f' : 'j';
const KEY_LARGER  = map_larger_right ? 'j' : 'f';
jsPsych.data.addProperties({
  sona_id: sona_id,
  subject_id: subject_id,
  standard: 5,
  key_mapping: map_larger_right ? 'smaller=F,larger=J' : 'smaller=J,larger=F',
  experiment: 'numerical_distance_effect'
});

const timeline = [];

// ---- 2. BROWSER CHECK (desktop only) -------------------------
timeline.push({
  type: jsPsychBrowserCheck,
  inclusion_function: (data) => data.mobile === false,
  exclusion_message: () =>
    '<p>Sorry, this study must be completed on a desktop or laptop computer with a keyboard.</p>'
});

// ---- 3. CONSENT (FILL IN with IRB-approved text) -------------
timeline.push({
  type: jsPsychHtmlButtonResponse,
  stimulus: `
    <div class="instructions">
      <h1>Informed Consent</h1>
      <p><em>[FILL IN: Replace this paragraph with your IRB-approved consent
      text — purpose of the study, what participation involves, time required,
      risks and benefits, that participation is voluntary and can be stopped at
      any time, how data are stored and kept confidential, and contact
      information for you and the St.&nbsp;Olaf IRB.]</em></p>
      <p>This study takes about 8&ndash;10 minutes. You will see single digits on
      the screen and decide, as quickly and accurately as you can, whether each
      is smaller or larger than 5.</p>
      <p>By clicking &ldquo;I agree&rdquo; you confirm that you are at least 18
      years old and consent to participate.</p>
    </div>`,
  choices: ['I agree', 'I do not wish to participate'],
  on_finish: (data) => {
    if (data.response === 1) {
      jsPsych.endExperiment('Thank you for your time. You have chosen not to participate.');
    }
  }
});

// ---- 4. DEMOGRAPHICS -----------------------------------------
timeline.push({
  type: jsPsychSurveyHtmlForm,
  preamble: '<div class="instructions"><h2>A few quick questions</h2></div>',
  html: `
    <div class="instructions">
      <div class="form-row">
        Age: <input name="age" type="number" min="18" max="120" required style="width:80px">
      </div>
      <div class="form-row">
        Which hand do you write with?
        <select name="handedness" required>
          <option value="" disabled selected>Choose…</option>
          <option value="right">Right</option>
          <option value="left">Left</option>
          <option value="both">Both</option>
        </select>
      </div>
      <div class="form-row">
        Is English your first language?
        <select name="english_first" required>
          <option value="" disabled selected>Choose…</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
    </div>`,
  button_label: 'Continue',
  data: { task: 'demographics' }
});

// ---- 5. ENTER FULLSCREEN -------------------------------------
timeline.push({ type: jsPsychFullscreen, fullscreen_mode: true });

// Persistent on-screen response reminder (respects counterbalanced mapping)
const smallerSide = (KEY_SMALLER === 'f') ? 'left' : 'right';
function reminderHTML() {
  const leftLabel  = (smallerSide === 'left')  ? 'smaller (F)' : 'larger (F)';
  const rightLabel = (smallerSide === 'left')  ? 'larger (J)'  : 'smaller (J)';
  return `<div class="reminder"><span class="k">${leftLabel}</span>
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          <span class="k">${rightLabel}</span></div>`;
}

// ---- 6. INSTRUCTIONS -----------------------------------------
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  choices: [' '],
  stimulus: `
    <div class="instructions">
      <h2>Instructions</h2>
      <p>On each trial you will see a single number from 1 to 9 (never 5).
      Your job is to decide whether the number is <strong>smaller than 5</strong>
      or <strong>larger than 5</strong>.</p>
      <p>Press <strong>${KEY_SMALLER.toUpperCase()}</strong> if the number is
      <strong>smaller</strong> than 5.<br>
      Press <strong>${KEY_LARGER.toUpperCase()}</strong> if the number is
      <strong>larger</strong> than 5.</p>
      <p>Respond as <strong>quickly and accurately</strong> as you can. Keep your
      index fingers resting on the <strong>F</strong> and <strong>J</strong> keys.</p>
      <p>First you will do a short practice with feedback. Press the
      <strong>space bar</strong> to begin.</p>
    </div>`
});

// ---- 7. STIMULI: digits 1-9 excluding the standard (5) -------
const STANDARD = 5;
const digits = [1, 2, 3, 4, 6, 7, 8, 9];
const stimuli = digits.map((d) => ({
  digit: d,
  distance: Math.abs(d - STANDARD),
  side: d < STANDARD ? 'smaller' : 'larger'
}));

const fixation = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<div class="fix">+</div>',
  choices: "NO_KEYS",
  trial_duration: 500,
  data: { task: 'fixation' }
};

const blank = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '',
  choices: "NO_KEYS",
  // jittered inter-trial interval, 400-700 ms
  trial_duration: () => jsPsych.randomization.randomInt(400, 700),
  data: { task: 'iti' }
};

function makeTrial(withFeedback) {
  const trial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: () =>
      `<div class="digit">${jsPsych.timelineVariable('digit')}</div>` + reminderHTML(),
    choices: ['f', 'j'],
    trial_duration: RESPONSE_LIMIT,
    data: {
      task: 'response',
      digit: jsPsych.timelineVariable('digit'),
      distance: jsPsych.timelineVariable('distance'),
      side: jsPsych.timelineVariable('side')
    },
    on_finish: (data) => {
      const correctKey = data.side === 'smaller' ? KEY_SMALLER : KEY_LARGER;
      data.correct_key = correctKey;
      data.responded = data.response !== null;
      data.correct = data.responded &&
        jsPsych.pluginAPI.compareKeys(data.response, correctKey);
    }
  };

  if (!withFeedback) return { timeline: [fixation, trial, blank] };

  const feedback = {
    type: jsPsychHtmlKeyboardResponse,
    choices: "NO_KEYS",
    trial_duration: 800,
    stimulus: () => {
      const last = jsPsych.data.getLastTrialData().values()[0];
      if (!last.responded) return '<div class="tooslow">Too slow — please respond faster</div>';
      return last.correct
        ? '<div class="feedback-ok">Correct</div>'
        : '<div class="feedback-no">Incorrect</div>';
    }
  };
  return { timeline: [fixation, trial, feedback, blank] };
}

// ---- 8. PRACTICE (with feedback) -----------------------------
const practiceList = jsPsych.randomization.repeat(stimuli, PRACTICE_REPS);
timeline.push({
  timeline: [makeTrial(true)],
  timeline_variables: practiceList,
  randomize_order: true,
  data: { phase: 'practice' }
});

// ---- 9. MAIN TASK (no feedback, split into blocks) -----------
const mainList = jsPsych.randomization.repeat(stimuli, MAIN_REPS); // equal reps per digit
const perBlock = Math.ceil(mainList.length / N_BLOCKS);

for (let b = 0; b < N_BLOCKS; b++) {
  // Break screen before each block (and a "start" screen before block 0)
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    choices: [' '],
    stimulus: () => {
      if (b === 0) {
        return `<div class="instructions"><h2>Practice complete</h2>
          <p>The main task is next. There will be <strong>no feedback</strong>.
          Keep responding as quickly and accurately as you can.</p>
          <p>Block 1 of ${N_BLOCKS}. Press the <strong>space bar</strong> to begin.</p></div>`;
      }
      return `<div class="instructions"><h2>Take a short break</h2>
        <p>You have finished block ${b} of ${N_BLOCKS}. When you are ready,
        press the <strong>space bar</strong> to continue with block ${b + 1}.</p></div>`;
    }
  });

  const blockStimuli = mainList.slice(b * perBlock, (b + 1) * perBlock);
  timeline.push({
    timeline: [makeTrial(false)],
    timeline_variables: blockStimuli,
    randomize_order: true,
    data: { phase: 'main', block: b + 1 }
  });
}

// ---- 10. SAVE TO DATAPIPE ------------------------------------
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  choices: "NO_KEYS",
  trial_duration: 400,
  stimulus: '<div class="instructions"><h2>Saving your data…</h2><p>Please wait.</p></div>'
});
timeline.push({
  type: jsPsychPipe,
  action: "save",
  experiment_id: DATAPIPE_EXPERIMENT_ID,
  filename: `${subject_id}.csv`,
  data_string: () => jsPsych.data.get().csv()
});

// ---- 11. EXIT FULLSCREEN + PRELOAD + RUN ---------------------
timeline.push({ type: jsPsychFullscreen, fullscreen_mode: false });
timeline.unshift({ type: jsPsychPreload, auto_preload: true });
jsPsych.run(timeline);
</script>
</html>
